[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "einf"
version = "0.1.0"
description = "A learning-oriented single-GPU LLM inference engine"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
qwen = ["safetensors>=0.7", "transformers>=5.5"]

[tool.maturin]
manifest-path = "crates/einf-control-py/Cargo.toml"
python-source = "src"
module-name = "einf._control"

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
