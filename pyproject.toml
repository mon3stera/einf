[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "einf"
version = "0.1.0"
description = "A learning-oriented single-GPU LLM inference engine"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
qwen = ["safetensors>=0.7", "transformers>=5.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"einf.executors.torch.ops" = ["README.md", "csrc/*.h", "csrc/*.cpp", "csrc/*.cu"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
